<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Pro DBD con Centro Dinámico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 { 
            color: #d91e18; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            font-size: 2rem; 
            text-shadow: 0 0 10px rgba(217, 30, 24, 0.5); 
            text-align: center;
        }

        .controles {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn-rol {
            background: #1f1f1f; 
            color: #888; 
            border: 2px solid #444;
            padding: 8px 20px; 
            cursor: pointer; 
            border-radius: 6px;
            text-transform: uppercase; 
            font-weight: bold; 
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .btn-rol.active { 
            background: #d91e18; 
            color: white; 
            border-color: #d91e18; 
            box-shadow: 0 0 15px rgba(217, 30, 24, 0.6); 
        }

        .ruleta-box {
            position: relative;
            width: 740px;
            height: 740px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 25px rgba(0,0,0,0.9));
        }

        canvas {
            border-radius: 50%;
            border: 12px solid #1a1a1a;
            background: #111;
        }

        .indicador {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 38px solid #f1c40f;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            z-index: 10;
        }

        .centro-ganador {
            position: absolute;
            width: 220px;
            height: 220px;
            background: rgba(10, 10, 10, 0.92);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #d91e18;
            box-shadow: 0 0 25px rgba(217, 30, 24, 0.7);
            z-index: 8;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            text-align: center;
            padding: 15px;
        }

        .centro-ganador.mostrar {
            opacity: 1;
            transform: scale(1);
        }

        .centro-ganador img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-top: 8px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .centro-ganador .texto-perk {
            font-size: 0.85rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            line-height: 1.1;
        }

        #btnGirar {
            margin-top: 20px;
            background: linear-gradient(135deg, #d91e18 0%, #610b08 100%);
            color: white; 
            border: none; 
            padding: 14px 38px;
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 8px;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: all 0.2s; 
            box-shadow: 0 5px 20px rgba(217, 30, 24, 0.5);
            z-index: 10;
        }
        #btnGirar:hover:not(:disabled) { background: linear-gradient(135deg, #ff2b24 0%, #8a110e 100%); transform: translateY(-2px); }
        #btnGirar:active:not(:disabled) { transform: translateY(1px); }
        #btnGirar:disabled { background: #444; cursor: not-allowed; box-shadow: none; color: #777;}

        #resultado {
            margin-top: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f1c40f;
            min-height: 2.2em;
            text-align: center;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body>

    <h1>Ruleta DBD</h1>

    <div class="controles">
        <button class="btn-rol active" id="btnSup" onclick="setRol('superviviente')">Superviviente</button>
        <button class="btn-rol" id="btnAsesino" onclick="setRol('asesino')">Asesino</button>
    </div>

    <div class="ruleta-box">
        <div class="indicador"></div>
        <canvas id="canvasRuleta" width="720" height="720"></canvas>
        
        <div id="centroGanador" class="centro-ganador">
            <div id="nombreGanadorCentro" class="texto-perk"></div>
            <img id="imagenGanadoraCentro" src="" alt="Icono Perk">
        </div>
    </div>

    <button id="btnGirar" onclick="iniciarGiro()">Girar Ruleta</button>
    <div id="resultado">¡Gira para escoger tu habilidad!</div>

    <script>
        const perksSuperviviente = [
            "Adrenalina", "Alerta", "Autocura", "Autodidacta", "Balancín", "Bienvenida a las máquinas", 
            "Borrón y cuenta nueva", "Bravuconería", "Buscapleitos", "Camaradería", "Camuflaje", 
            "Capacidad de adaptación", "Carrera explosiva", "Cédula de identidad", "Cercanía familiar", 
            "Cerrojazo", "Chivo expiatorio", "Clarividencia", "Compañerismo", "Conocimiento botánico", 
            "Contraproducente", "Corrido a toda velocidad", "Danza con las sombras", "Derecho a la pereza", 
            "Desesperación", "Determinación", "Distorción", "Duro de matar", "Evasión urbana", 
            "Exhibición", "Firmeza", "Golpe decisivo", "Golpe fuerte", "Guardián", "Hacerse el muerto", 
            "Improvisación", "Inquebrantable", "Instinto de supervivencia", "Líder", "Llamativo", 
            "Mente abierta", "Mente despierta", "Mente en blanco", "Mente preclara", "Moneda de cambio", 
            "Motivación", "Muestreo", "Neurología", "No estás solo", "Optimista", "Oportunidades", 
            "Pánico controlado", "Paranoia", "Paso ligero", "Pie ligero", "Por el equipo", 
            "Presagio", "Propósito oculto", "Protección", "Reacción en cadena", "Reacción rápida", 
            "Rebote", "Recompensa", "Resiliencia", "Resistencia", "Revisión de guardia", "Robo de identidad", 
            "Rompehielos", "Salto de fe", "Salvavidas", "Sangre fría", "Secreto desvelado", "Sensación térmica", 
            "Sexto sentido", "Soberanía", "Solución rápida", "Suerte de principiante", "Tenacidad", 
            "Teoría del caos", "Tiempo prestado", "Trato cerrado", "Trabajo en equipo", "Tumbar la casa", 
            "Vínculo", "Visión periférica", "Visión tunelada", "Visionaria", "¡A por todas!"
        ];

        const perksAsesino = [
            "Agitación", "Aleteo de cuervo", "Amenaza persistente", "Amor desmedido", "Anulación", 
            "Apocalipsis", "Aprehensión", "Asesino implacable", "Audacia", "Autómata", 
            "Baila conmigo", "Barbacoa y chile", "Bocanada", "Bofetada de realidad", "Cazador de cabezas", 
            "Cazador furtivo", "Caza silenciosa", "Caza torpe", "Cercenador", "Cicatrices brutales", 
            "Ciclón", "Claridad mortal", "Cobarde", "Colapso", "Conexión dolorosa", "Corrupción", 
            "Degollador", "Dominación", "Eco sangriento", "Efecto dominó", "Elegido para morir", 
            "Ermitaño", "Espanto", "Estatura imponente", "Fauces de la muerte", "Foco de atención", 
            "Fuerza bruta", "Furia de la jauría", "Furia espiritual", "Garras de hierro", "Golpe bajo", 
            "Grito ensordecedor", "Imparable", "Impresión duradera", "Incansable", "Inercia", 
            "Intervención corrupta", "Llamado de la enfermera", "Llamarada", "Lluvia de sangre", 
            "Maleficio: Caza menor", "Maleficio: Devorador de esperanza", "Maleficio: Duende", 
            "Maleficio: Juguetón", "Maleficio: Muerte ineludible", "Maleficio: Nostalgia", 
            "Maleficio: Pentimento", "Maleficio: Ruina", "Maleficio: Superstición", "Maleficio: Tierra carbonizada", 
            "Maleficio: Tótem de la perdición", "Monstruoso santuario", "Mortal o inútil", "Murmullos", 
            "No hay salida", "Ojo por ojo", "Oportunidad perdida", "Pánico desencadenado", "Pavor a los ciervos", 
            "Pesadilla en vida", "Poder oculto", "Poderío", "Presencia atemorizante", "Prestigio", 
            "Prolongación de agonía", "Rastro invisible", "Reacción violenta", "Represalia", 
            "Resonancia de dolor", "Retribución", "Salvajismo", "Se acabó el juego", "Sepulturero", 
            "Sombra de muerte", "Sordo", "Surgimiento", "Temblores trepidantes", "Tinta indeleble", 
            "Tinkerer (Arreglador)", "Tormento", "Traición", "Trampero", "Venganza", "Voracidad"
        ];

        const coloresRuleta = [
            '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', 
            '#e67e22', '#1abc9c', '#e84393', '#00cec9', '#e17055'
        ];

        let rolActual = 'superviviente';
        let listaActual = perksSuperviviente;
        let anguloActual = 0;
        let estaGirando = false;

        const canvas = document.getElementById('canvasRuleta');
        const ctx = canvas.getContext('2d');
        const centroX = canvas.width / 2;
        const centroY = canvas.height / 2;
        const radio = canvas.width / 2 - 12;

        function dibujarRuleta(anguloRotacion = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const total = listaActual.length;
            const arcos = (2 * Math.PI) / total;

            listaActual.forEach((perk, index) => {
                const anguloInicio = anguloRotacion + (index * arcos);
                const anguloFin = anguloInicio + arcos;

                ctx.beginPath();
                ctx.moveTo(centroX, centroY);
                ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
                ctx.closePath();
                ctx.fillStyle = coloresRuleta[index % coloresRuleta.length];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.save();
                ctx.translate(centroX, centroY);
                ctx.rotate(anguloInicio + arcos / 2);
                
                ctx.textAlign = 'right';
                ctx.fillStyle = '#111';
                ctx.font = 'bold 10px sans-serif';
                
                let textoMostrar = perk;
                if (textoMostrar.length > 25) {
                    textoMostrar = textoMostrar.substring(0, 23) + '...';
                }

                ctx.fillText(textoMostrar, radio - 18, 3.5);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(centroX, centroY, 35, 0, 2 * Math.PI);
            ctx.fillStyle = '#222';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#444';
            ctx.stroke();
        }

        function setRol(rol) {
            if (estaGirando) return;
            rolActual = rol;
            listaActual = (rol === 'superviviente') ? perksSuperviviente : perksAsesino;
            
            document.getElementById('btnSup').classList.toggle('active', rol === 'superviviente');
            document.getElementById('btnAsesino').classList.toggle('active', rol === 'asesino');

            document.getElementById('centroGanador').classList.remove('mostrar');

            anguloActual = 0;
            document.getElementById('resultado').innerText = "¡Rol cambiado! Gira para probar suerte.";
            dibujarRuleta(anguloActual);
        }

        function iniciarGiro() {
            if (estaGirando) return;
            estaGirando = true;
            document.getElementById('btnGirar').disabled = true;
            document.getElementById('resultado').innerText = "Girando...";
            
            document.getElementById('centroGanador').classList.remove('mostrar');

            const totalPerks = listaActual.length;
            const arcos = (2 * Math.PI) / totalPerks;
            const indiceGanador = Math.floor(Math.random() * totalPerks);

            const vueltas = 7 * 2 * Math.PI; 
            const objetivoAngulo = vueltas + (3 * Math.PI / 2) - (indiceGanador * arcos) - (arcos / 2);

            let tiempoInicio = null;
            const duracion = 5000;

            function animarGiro(tiempoActual) {
                if (!tiempoInicio) tiempoInicio = tiempoActual;
                const tiempoTranscurrido = tiempoActual - tiempoInicio;
                const progreso = Math.min(tiempoTranscurrido / duracion, 1);
                
                const easeProgreso = 1 - Math.pow(1 - progreso, 3);

                const anguloActualAnimacion = anguloActual + (objetivoAngulo * easeProgreso);
                dibujarRuleta(anguloActualAnimacion);

                if (progreso < 1) {
                    requestAnimationFrame(animarGiro);
                } else {
                    estaGirando = false;
                    document.getElementById('btnGirar').disabled = false;
                    anguloActual = (anguloActual + objetivoAngulo) % (2 * Math.PI);
                    
                    const perkGanadora = listaActual[indiceGanador];

                    document.getElementById('resultado').innerHTML = `¡Ganador:<br><span style="color:#ffffff; font-size:1.5rem; text-shadow: 0 0 10px #d91e18;">${perkGanadora}</span>!`;

                    const centroGanador = document.getElementById('centroGanador');
                    document.getElementById('nombreGanadorCentro').innerText = perkGanadora;
                    
                    document.getElementById('imagenGanadoraCentro').src = "https://raw.githubusercontent.com/gio-del-rio/dbd-icons-placeholder/main/icon_perk.png";
                    document.getElementById('imagenGanadoraCentro').onerror = function() {
                        this.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70' viewBox='0 0 24 24' fill='none' stroke='%23f1c40f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>";
                    };

                    centroGanador.classList.add('mostrar');
                }
            }

            requestAnimationFrame(animarGiro);
        }

        dibujarRuleta(0);
    </script>
</body>
</html>
