<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 { 
            color: #d91e18; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            font-size: 2.4rem; 
            text-shadow: 0 0 10px rgba(217, 30, 24, 0.5); 
            text-align: center;
        }

        .controles {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn-rol {
            background: #1f1f1f; 
            color: #888; 
            border: 2px solid #444;
            padding: 10px 24px; 
            cursor: pointer; 
            border-radius: 6px;
            text-transform: uppercase; 
            font-weight: bold; 
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-rol.active { 
            background: #d91e18; 
            color: white; 
            border-color: #d91e18; 
            box-shadow: 0 0 15px rgba(217, 30, 24, 0.6); 
        }

        .layout-principal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            max-width: 1400px;
        }

        .ruleta-box {
            position: relative;
            width: 900px;
            height: 900px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(217, 30, 24, 0.3);
            border: 4px solid #333;
            flex-shrink: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .indicador {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #f1c40f;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            z-index: 10;
        }

        .centro-ganador {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 6px solid #d91e18;
            box-shadow: 0 0 25px rgba(217, 30, 24, 0.9);
            z-index: 8;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            text-align: center;
            padding: 15px;
        }

        .centro-ganador.mostrar {
            opacity: 1;
            transform: scale(1);
        }

        .centro-ganador img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-top: 6px;
            filter: drop-shadow(0 0 6px rgba(241, 196, 15, 0.6));
            border-radius: 6px;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border: 1px solid #444;
        }

        .centro-ganador .texto-perk {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            line-height: 1.1;
        }

        /* Panel derecho rediseñado con el contenedor de la build */
        .panel-derecho {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .build-container {
            background: #121212;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            width: 380px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .slot {
            background: #090909;
            border: 2px dashed #333;
            border-radius: 8px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .slot.lleno {
            border: 2px solid #d91e18;
            border-style: solid;
            background: #1a1a1a;
        }

        .slot img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(241, 196, 15, 0.4));
        }

        .slot span {
            font-size: 0.65rem;
            color: #777;
            text-align: center;
            padding: 0 2px;
        }

        .slot.lleno span {
            display: none; /* Oculta texto genérico cuando tiene imagen */
        }

        .btn-limpiar {
            width: 100%;
            background: #1f1f1f;
            color: #bbb;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .btn-limpiar:hover {
            background: #d91e18;
            color: white;
            border-color: #d91e18;
        }

        #btnGirar {
            background: linear-gradient(135deg, #d91e18 0%, #610b08 100%);
            color: white; 
            border: none; 
            padding: 16px 36px;
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 8px;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: all 0.2s; 
            box-shadow: 0 5px 20px rgba(217, 30, 24, 0.5);
            z-index: 20;
            width: 100%;
        }
        #btnGirar:hover:not(:disabled) { background: linear-gradient(135deg, #ff2b24 0%, #8a110e 100%); transform: translateY(-2px); }
        #btnGirar:active:not(:disabled) { transform: translateY(1px); }
        #btnGirar:disabled { background: #444; cursor: not-allowed; box-shadow: none; color: #777;}

        #resultado {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            text-align: center;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
            max-width: 350px;
        }
    </style>
</head>

    <h1>Ruleta DBD</h1>

    <div class="controles">
        <button class="btn-rol active" id="btnSup" onclick="setRol('superviviente')">Superviviente</button>
        <button class="btn-rol" id="btnAsesino" onclick="setRol('asesino')">Asesino</button>

            </div>
        </div>

        <div class="panel-derecho">
            <!-- Cuadro de Build con 4 slots -->
            <div class="build-container">
                <div class="build-header">
                    <span id="tituloBuild">TU BUILD ACTUAL (0/4)</span>
                </div>
                <div class="slots-grid">

                    <div class="slot" id="slot-1"><span>Slot 2</span></div>
                    <div class="slot" id="slot-2"><span>Slot 3</span></div>
                    <div class="slot" id="slot-3"><span>Slot 4</span></div>
                </div>
                <button class="btn-limpiar" onclick="limpiarBuild()">Limpiar Build</button>
            </div>

            <button id="btnGirar" onclick="iniciarGiro()">Girar Ruleta</button>
            <div id="resultado">¡Gira para escoger tu habilidad!</div>
        </div>
    </div>

            "Un lugar para nosotros": "https://i.ibb.co/fYPX8Z2X/Icons-Perks-a-Place-For-Us.webp",
            "Cinco movimientos adelante": "https://i.ibb.co/GQtRwV3W/Icons-Perks-Five-Moves-Ahead.webp",
            "Estado de fluido": "https://i.ibb.co/4nV47ZvN/Icons-Perks-Flow-State.webp",
            "Interrogatorio": "https://i.ibb.co/3m5WY6cn/T-UI-icons-Perks-Cross-Examination.webp",
            "Echar una mano": "https://i.ibb.co/hkVhFHY/T-UI-icons-Perks-Lenda-Hand.webp",
            "Máxima velocidad": "https://i.ibb.co/XZGcLQMf/T-UI-icons-Perks-Wide-Open-Throttle.webp",
            "Cosechas lo que siembras": "https://i.ibb.co/HTHxCFSP/T-UI-icons-Perks-Fruits-Of-Your-Labor.webp",
            "Grito de salvación": "https://i.ibb.co/676D9Twc/T-UI-icons-Perks-Salvations-Cry.webp",
            "Bendicion: Determinacion": "https://i.ibb.co/ytJk37R/T-UI-icons-Perks-Boon-Steadfast.webp"
        };

        const basePerksAsesino = {};

        let rolActual = 'superviviente';
        let listaActual = Object.keys(basePerksSuperviviente);
        let anguloActualGrados = 0;
        let estaGirando = false;
        let buildActual = [];
        
        const imagenesPrecaragadas = {};

        function precargarImagenes() {
            const baseDatosActiva = (rolActual === 'superviviente') ? basePerksSuperviviente : basePerksAsesino;
            for (let perk in baseDatosActiva) {
                const url = baseDatosActiva[perk];
                if (!imagenesPrecaragadas[url]) {
                    const img = new Image();
                    img.src = url;
                    imagenesPrecaragadas[url] = img;
                }
            }
        }

        let audioCtx = null;
        function inicializarAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function reproducirSonidoTic() {
            try {
                inicializarAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function reproducirSonidoGanador() {
            try {
                inicializarAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.9);
            } catch (e) {}
        }

        const coloresRuleta = [
            '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', 
            '#e67e22', '#1abc9c', '#e84393', '#00cec9', '#e17055',
            '#fd79a8', '#6c5ce7', '#00b894', '#fdcb6e', '#e17055',
            '#00cec9', '#a29bfe', '#ffeaa7', '#fab1a0', '#74b9ff', '#55efc4',
            '#ff7675', '#74b9ff', '#dfe6e9', '#d63031', '#0984e3', '#00b894',
            '#e84393', '#fdcb6e', '#00cec9', '#e17055', '#a29bfe', '#ffeaa7',
            '#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3', '#54a0ff',
            '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#5f27cd', '#222f3e',
            '#e056fd', '#badc58', '#f0932b', '#eb4d4b', '#6ab04c', '#487eb0',
            '#ff7979', '#badc58', '#7ed6df', '#e056fd', '#686de0', '#30336b'
        ];

        const canvas = document.getElementById('canvasRuleta');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const centroX = canvas.width / 2;
        const centroY = canvas.height / 2;
        const radio = canvas.width / 2 - 25;

        function dibujarRuletaEstatica() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const total = listaActual.length;
            
            if (total === 0) {
                ctx.beginPath();
                ctx.arc(centroX, centroY, radio, 0, 2 * Math.PI);
                ctx.fillStyle = '#111';
                ctx.fill();
                return;
            }

            const arcos = (2 * Math.PI) / total;

            listaActual.forEach((perk, index) => {
                const anguloInicio = index * arcos;
                const anguloFin = anguloInicio + arcos;

                ctx.beginPath();
                ctx.moveTo(centroX, centroY);
                ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
                ctx.closePath();
                ctx.fillStyle = coloresRuleta[index % coloresRuleta.length];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centroX, centroY);
                ctx.rotate(anguloInicio + arcos / 2);
                ctx.textAlign = 'right';
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                let texto = perk;
                if (texto.length > 20) texto = texto.substring(0, 18) + '...';
                ctx.fillText(texto, radio - 35, 8);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(centroX, centroY, 70, 0, 2 * Math.PI);
            ctx.fillStyle = '#222';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#444';
            ctx.stroke();
        }

        function setRol(rol) {
            if (estaGirando) return;
            rolActual = rol;
            listaActual = (rol === 'superviviente') ? Object.keys(basePerksSuperviviente) : Object.keys(basePerksAsesino);
            
            document.getElementById('btnSup').classList.toggle('active', rol === 'superviviente');
            document.getElementById('btnAsesino').classList.toggle('active', rol === 'asesino');
            document.getElementById('centroGanador').classList.remove('mostrar');

            limpiarBuild();
            precargarImagenes();

            const total = listaActual.length;
            anguloActualGrados = total > 0 ? - 90 - (360 / total) / 2 : 0;
            canvas.style.transform = `translateZ(0) rotate(${anguloActualGrados}deg)`;
            
            document.getElementById('resultado').innerText = total === 0 ? "Aún no hay habilidades cargadas." : "¡Gira para probar suerte!";
            dibujarRuletaEstatica();
        }

        function actualizarUIBuild() {
            for (let i = 0; i < 4; i++) {
                const slotEl = document.getElementById(`slot-${i}`);
                if (buildActual[i]) {
                    const perkNombre = buildActual[i];
                    const baseDatosActiva = (rolActual === 'superviviente') ? basePerksSuperviviente : basePerksAsesino;
                    const urlImg = baseDatosActiva[perkNombre];
                    
                    slotEl.classList.add('lleno');
                    slotEl.innerHTML = `<img src="${urlImg}" title="${perkNombre}" alt="${perkNombre}">`;
                } else {
                    slotEl.classList.remove('lleno');
                    slotEl.innerHTML = `<span>Slot ${i + 1}</span>`;
                }
            }
            document.getElementById('tituloBuild').innerText = `TU BUILD ACTUAL (${buildActual.length}/4)`;
        }

        function limpiarBuild() {
            if (estaGirando) return;
            buildActual = [];
            actualizarUIBuild();
        }

        function iniciarGiro() {
            if (estaGirando) return;
            if (buildActual.length >= 4) {
                alert("¡Ya tienes la build completa (4/4)! Limpia la build para empezar de nuevo.");
                return;
            }
            if (listaActual.length === 0) {
                alert("Primero debes agregar al menos una habilidad.");
                return;
            }

            inicializarAudio();
            estaGirando = true;
            document.getElementById('btnGirar').disabled = true;
            document.getElementById('resultado').innerText = "Girando...";
            document.getElementById('centroGanador').classList.remove('mostrar');

            const totalPerks = listaActual.length;
            const gradosPorSector = 360 / totalPerks;
            
            const indiceGanador = Math.floor(Math.random() * totalPerks);
            const vueltasExtra = 10 * 360; 
            
            const anguloBaseInicial = -90;
            const objetivoGrados = vueltasExtra + (anguloBaseInicial - (indiceGanador * gradosPorSector) - (gradosPorSector / 2) - anguloActualGrados);

            let tiempoInicio = null;
            const duracion = 7000; 
            let ultimoIndiceSonido = -1;

            function animarGiro(tiempoActual) {
                if (!tiempoInicio) tiempoInicio = tiempoActual;
                const tiempoTranscurrido = tiempoActual - tiempoInicio;
                const progreso = Math.min(tiempoTranscurrido / duracion, 1);
                
                const easeProgreso = 1 - Math.pow(1 - progreso, 3);
                const anguloActualAnimacion = anguloActualGrados + (objetivoGrados * easeProgreso);
                
                canvas.style.transform = `translateZ(0) rotate(${anguloActualAnimacion}deg)`;

                const anguloNormalizado = (anguloActualAnimacion % 360 + 360) % 360;
                const anguloRelativo = (360 - anguloNormalizado - 90 - gradosPorSector/2) % 360;
                const indiceActualAudio = Math.floor(((anguloRelativo < 0 ? anguloRelativo + 360 : anguloRelativo) / gradosPorSector)) % totalPerks;
                
                if (indiceActualAudio !== ultimoIndiceSonido) {
                    reproducirSonidoTic();
                    ultimoIndiceSonido = indiceActualAudio;
                }

                if (progreso < 1) {
                    requestAnimationFrame(animarGiro);
                } else {
                    estaGirando = false;
                    document.getElementById('btnGirar').disabled = false;
                    anguloActualGrados = (anguloActualGrados + objetivoGrados) % 360;
                    
                    const perkGanadora = listaActual[indiceGanador];
                    const baseDatosActiva = (rolActual === 'superviviente') ? basePerksSuperviviente : basePerksAsesino;
                    const urlImagen = baseDatosActiva[perkGanadora];

                    reproducirSonidoGanador();

                    // Agregar al slot de la build
                    if (buildActual.length < 4) {
                        buildActual.push(perkGanadora);
                        actualizarUIBuild();
                    }

                    document.getElementById('resultado').innerHTML = `¡Ganador:<br><span style="color:#ffffff; font-size:1.4rem; text-shadow: 0 0 10px #d91e18;">${perkGanadora}</span>!`;

                    const centroGanador = document.getElementById('centroGanador');
                    document.getElementById('nombreGanadorCentro').innerText = perkGanadora;
                    
                    const imgElement = document.getElementById('imagenGanadoraCentro');
                    imgElement.src = urlImagen;
                    
                    centroGanador.classList.add('mostrar');
                }
            }

            requestAnimationFrame(animarGiro);
        }

        precargarImagenes();
        const totalInit = listaActual.length;
        anguloActualGrados = totalInit > 0 ? - 90 - (360 / totalInit) / 2 : 0;
        dibujarRuletaEstatica();
        canvas.style.transform = `translateZ(0) rotate(${anguloActualGrados}deg)`;
    </script>
