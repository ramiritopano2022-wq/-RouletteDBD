        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 { 
            color: #d91e18; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            font-size: 2.4rem; 
            text-shadow: 0 0 10px rgba(217, 30, 24, 0.5); 
            text-align: center;
        }

        .controles {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn-rol {
            background: #1f1f1f; 
            color: #888; 
            border: 2px solid #444;
            padding: 10px 24px; 
            cursor: pointer; 
            border-radius: 6px;
            text-transform: uppercase; 
            font-weight: bold; 
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-rol.active { 
            background: #d91e18; 
            color: white; 
            border-color: #d91e18; 
            box-shadow: 0 0 15px rgba(217, 30, 24, 0.6); 
        }

        /* Contenedor más grande */
        .ruleta-box {
            position: relative;
            width: 780px;
            height: 780px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.9));
        }

        /* Canvas ampliado visualmente a 760px */
        canvas {
            width: 760px;
            height: 760px;
            border-radius: 50%;
            border: 12px solid #1a1a1a;
            background: #111;
            will-change: transform;
            transform: translateZ(0);
        }

        .indicador {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #f1c40f;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            z-index: 10;
        }

        .centro-ganador {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(15, 15, 15, 0.98);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #d91e18;
            box-shadow: 0 0 25px rgba(217, 30, 24, 0.8);
            z-index: 8;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            text-align: center;
            padding: 15px;
        }

        .centro-ganador.mostrar {
            opacity: 1;
            transform: scale(1);
        }

        .centro-ganador img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-top: 6px;
            filter: drop-shadow(0 0 6px rgba(241, 196, 15, 0.6));
            border-radius: 6px;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border: 1px solid #444;
        }

        .centro-ganador .texto-perk {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            line-height: 1.1;
        }

        #btnGirar {
            margin-top: 25px;
            background: linear-gradient(135deg, #d91e18 0%, #610b08 100%);
            color: white; 
            border: none; 
            padding: 14px 38px;
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 8px;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: all 0.2s; 
            box-shadow: 0 5px 20px rgba(217, 30, 24, 0.5);
            z-index: 10;
        }
        #btnGirar:hover:not(:disabled) { background: linear-gradient(135deg, #ff2b24 0%, #8a110e 100%); transform: translateY(-2px); }
        #btnGirar:active:not(:disabled) { transform: translateY(1px); }
        #btnGirar:disabled { background: #444; cursor: not-allowed; box-shadow: none; color: #777;}

        #resultado {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f1c40f;
            min-height: 2.2em;
            text-align: center;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);

        let audioCtx = null;
        function inicializarAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function reproducirSonidoTic() {
            try {
                inicializarAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function reproducirSonidoGanador() {
            try {
                inicializarAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.9);
            } catch (e) {}
        }

        const ctx = canvas.getContext('2d');

        const centroX = canvas.width / 2;
        const centroY = canvas.height / 2;
        const radio = canvas.width / 2 - 25;

        function dibujarRuleta(anguloRotacion = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const total = listaActual.length;
            
            if (total === 0) {
                ctx.beginPath();
                ctx.arc(centroX, centroY, radio, 0, 2 * Math.PI);
                ctx.fillStyle = '#111';
                ctx.fill();
                return;
            }

            const arcos = (2 * Math.PI) / total;

            listaActual.forEach((perk, index) => {
                const anguloInicio = anguloRotacion + (index * arcos);
                const anguloFin = anguloInicio + arcos;

                ctx.beginPath();
                ctx.moveTo(centroX, centroY);
                ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
                ctx.closePath();
                ctx.fillStyle = coloresRuleta[index % coloresRuleta.length];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centroX, centroY);
                ctx.rotate(anguloInicio + arcos / 2);
                ctx.textAlign = 'right';
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                let texto = perk;
                if (texto.length > 20) texto = texto.substring(0, 18) + '...';
                ctx.fillText(texto, radio - 35, 8);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(centroX, centroY, 70, 0, 2 * Math.PI);
            ctx.fillStyle = '#222';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#444';
            ctx.stroke();
        }

        function setRol(rol) {
            if (estaGirando) return;
            rolActual = rol;
            listaActual = (rol === 'superviviente') ? Object.keys(basePerksSuperviviente) : Object.keys(basePerksAsesino);
            
            document.getElementById('btnSup').classList.toggle('active', rol === 'superviviente');
            document.getElementById('btnAsesino').classList.toggle('active', rol === 'asesino');
            document.getElementById('centroGanador').classList.remove('mostrar');

            precargarImagenes();

            const total = listaActual.length;
            anguloActual = total > 0 ? - (Math.PI / 2) - ((2 * Math.PI) / total) / 2 : 0;
            
            document.getElementById('resultado').innerText = total === 0 ? "Aún no hay habilidades cargadas." : "¡Gira para probar suerte!";
            dibujarRuleta(anguloActual);
        }

        function iniciarGiro() {
            if (estaGirando) return;
            if (listaActual.length === 0) {
                alert("Primero debes agregar al menos una habilidad.");
                return;
            }

            inicializarAudio();
            estaGirando = true;
            document.getElementById('btnGirar').disabled = true;
            document.getElementById('resultado').innerText = "Girando...";
            document.getElementById('centroGanador').classList.remove('mostrar');

            const totalPerks = listaActual.length;
            const arcos = (2 * Math.PI) / totalPerks;
            
            const indiceGanador = Math.floor(Math.random() * totalPerks);
            const vueltas = 10 * 2 * Math.PI; 
            
            const anguloBaseInicial = - (Math.PI / 2);
            const objetivoAngulo = vueltas + (anguloBaseInicial - (indiceGanador * arcos) - (arcos / 2) - anguloActual);

            let tiempoInicio = null;
            const duracion = 7000; 
            let ultimoIndiceSonido = -1;

            function animarGiro(tiempoActual) {
                if (!tiempoInicio) tiempoInicio = tiempoActual;
                const tiempoTranscurrido = tiempoActual - tiempoInicio;
                const progreso = Math.min(tiempoTranscurrido / duracion, 1);
                
                const easeProgreso = 1 - Math.pow(1 - progreso, 3);
                const anguloActualAnimacion = anguloActual + (objetivoAngulo * easeProgreso);
                
                dibujarRuleta(anguloActualAnimacion);

                const anguloRelativo = (anguloActualAnimacion - (-Math.PI/2 - arcos/2)) % (2 * Math.PI);
                const indiceActualAudio = Math.floor((2 * Math.PI - (anguloRelativo < 0 ? anguloRelativo + 2 * Math.PI : anguloRelativo)) / arcos) % totalPerks;
                
                if (indiceActualAudio !== ultimoIndiceSonido) {
                    reproducirSonidoTic();
                    ultimoIndiceSonido = indiceActualAudio;
                }

                if (progreso < 1) {
                    requestAnimationFrame(animarGiro);
                } else {
                    estaGirando = false;
                    document.getElementById('btnGirar').disabled = false;
                    anguloActual = (anguloActual + objetivoAngulo) % (2 * Math.PI);
                    
                    const perkGanadora = listaActual[indiceGanador];
                    const baseDatosActiva = (rolActual === 'superviviente') ? basePerksSuperviviente : basePerksAsesino;
                    const urlImagen = baseDatosActiva[perkGanadora];

                    reproducirSonidoGanador();

                    document.getElementById('resultado').innerHTML = `¡Ganador:<br><span style="color:#ffffff; font-size:1.4rem; text-shadow: 0 0 10px #d91e18;">${perkGanadora}</span>!`;

                    const centroGanador = document.getElementById('centroGanador');
                    document.getElementById('nombreGanadorCentro').innerText = perkGanadora;
                    
                    const imgElement = document.getElementById('imagenGanadoraCentro');
                    imgElement.src = urlImagen;
                    
                    centroGanador.classList.add('mostrar');
                }
            }

            requestAnimationFrame(animarGiro);
        }

        precargarImagenes();
        const totalInit = listaActual.length;
        anguloActual = totalInit > 0 ? - (Math.PI / 2) - ((2 * Math.PI) / totalInit) / 2 : 0;
        dibujarRuleta(anguloActual);
    </script>
</body>
</html>
